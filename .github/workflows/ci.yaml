name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main are not, so a
  # publish in progress is never interrupted.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: craft-tidy
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Run clippy
        run: cargo +stable clippy --all-targets -- -D warnings
      - name: Check that the generated spread tasks are up to date
        working-directory: .
        run: |
          python3 spread/generate-tool-tasks.py
          git diff --exit-code spread/general/

  test:
    name: Test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stable, and the rust-version declared in craft-tidy/Cargo.toml.
        rust: [stable, '1.89']
    defaults:
      run:
        working-directory: craft-tidy
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Install PyYAML
        # Used by the tests to compare fixes with Snapcraft's YAML parser.
        run: sudo apt-get install -y python3-yaml
      - name: Run tests
        run: cargo +${{ matrix.rust }} test

  vscode:
    name: Package the VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Check the extension
        run: node --check extension.js
      - name: Package
        run: npm run package
      - name: Upload the extension
        uses: actions/upload-artifact@v4
        with:
          name: craft-tidy-vscode
          path: editors/vscode/*.vsix
          if-no-files-found: error

  zed:
    name: Build the Zed extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/zed
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-wasip2
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Run clippy
        run: cargo +stable clippy --target wasm32-wasip2 -- -D warnings
      - name: Build
        run: cargo +stable build --release --target wasm32-wasip2

  snap:
    name: Build and test the snap (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each architecture is built natively. snapcraft test runs the
          # spread tests on the runner itself and only selects the system
          # matching the runner's OS, which must be one of the systems in
          # snapcraft-test.yaml.
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Pack and run the spread tests
        id: pack
        uses: canonical/craft-actions/snapcraft/pack@v1
        with:
          test: true
      - name: Upload the snap
        uses: actions/upload-artifact@v4
        with:
          name: craft-tidy-snap-${{ matrix.arch }}
          path: ${{ steps.pack.outputs.snaps }}
          if-no-files-found: error

  publish:
    name: Publish to edge (${{ matrix.arch }})
    # Only commits on main are published, once every check has passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, snap]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    environment: snap-store
    steps:
      - name: Download the snap
        uses: actions/download-artifact@v4
        with:
          name: craft-tidy-snap-${{ matrix.arch }}
      - name: Find the snap
        id: snap
        run: echo "path=$(ls ./*.snap)" >> "$GITHUB_OUTPUT"
      - name: Upload and release to edge
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: edge
