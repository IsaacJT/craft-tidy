backends:
  craft:
    type: craft
    # On CI, snapcraft test runs the tests directly on the runner and only
    # selects the system matching the runner's OS, so the CI runner's system
    # (see .github/workflows/ci.yaml) must be listed here.
    systems:
      - ubuntu-24.04
      - ubuntu-26.04

suites:
  spread/general/:
    summary: End-to-end tests of the installed craft-tidy snap
    environment:
      # Projects are created in root's home directory, which the strictly
      # confined snap can reach through the home interface.
      WORK: /root/work/task
    prepare: |
      snap install "$CRAFT_ARTIFACT" --dangerous
    restore: |
      snap remove craft-tidy --purge
    prepare-each: |
      rm -rf /root/work
      mkdir -p "$WORK"
      # Most test projects have no license, which is only what the tasks
      # testing metadata-license are about; they enable it with
      # --checks='-*,metadata-license'. A .craft-tidy of a task takes
      # precedence over this one, so it must disable it too. (This is not
      # in /root itself, as the snap cannot read hidden files there.)
      echo 'checks: -metadata-license' > /root/work/.craft-tidy
    restore-each: |
      rm -rf /root/work

exclude:
  - .git
  - craft-tidy/target

kill-timeout: 30m
