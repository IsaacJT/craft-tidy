summary: Lint the project files of the other craft tools

execute: |
  cd "$WORK"
  cat > rockcraft.yaml <<'EOF'
  name: rock
  parts:
    rock:
      plugin: nil
      stage-packages: [b, a]
  EOF
  cat > charmcraft.yaml <<'EOF'
  name: charm
  parts:
    charm:
      plugin: charm
      build-packages: [d, c]
  EOF
  mkdir snap
  printf 'name: snap\nparts:\n  snap:\n    plugin: nil\n' > snap/snapcraft.yaml

  craft-tidy > out.txt
  cat out.txt
  test "$(wc -l < out.txt)" -eq 2
  # One file after the other, in alphabetical order of the tools.
  head -n1 out.txt | MATCH "^\./charmcraft.yaml:5:.*\[style-sorted-lists\]"
  tail -n1 out.txt | MATCH "^\./rockcraft.yaml:5:.*\[style-sorted-lists\]"
  # project-file-location only applies to Snapcraft.
  NOMATCH "project-file-location" < out.txt

  # A single file can be given explicitly.
  craft-tidy rockcraft.yaml | MATCH "rockcraft.yaml"
  craft-tidy rockcraft.yaml | NOMATCH "charmcraft.yaml"
