summary: Lint imagecraft projects

execute: |
  cd "$WORK"

  # Only imagecraft.yaml in the project root is read, like imagecraft does.
  mkdir -p image build-aux
  cat > image/imagecraft.yaml <<'EOF'
  name: my-image
  base: ubuntu@24.04
  version: '1.0'
  summary: An image for testing craft-tidy
  description: An image for testing craft-tidy.
  platforms:
    amd64:
  parts:
    rootfs:
      plugin: nil
      stage-packages: [systemd, linux-generic]
  EOF
  cp image/imagecraft.yaml original.yaml
  cp image/imagecraft.yaml .imagecraft.yaml
  cp image/imagecraft.yaml build-aux/imagecraft.yaml
  set +e
  craft-tidy 2> err.txt
  status=$?
  set -e
  test "$status" -eq 2
  MATCH "no craft project file found" < err.txt

  # Problems are reported with locations. project-file-location only
  # applies to Snapcraft, so a imagecraft.yaml in the root is fine.
  mv image/imagecraft.yaml imagecraft.yaml
  craft-tidy > out.txt
  cat out.txt
  test "$(wc -l < out.txt)" -eq 1
  MATCH "^\./imagecraft.yaml:11:[0-9]+: warning: .*\[style-sorted-lists\]" < out.txt
  NOMATCH "project-file-location" < out.txt

  # The file can also be given explicitly.
  craft-tidy "$WORK/imagecraft.yaml" | MATCH "imagecraft.yaml:11:.*\[style-sorted-lists\]"

  # Long lines are found too.
  sed -i 's/^summary: .*/summary: A summary that is far too long for a single line of eighty characters here/' imagecraft.yaml
  craft-tidy | MATCH "imagecraft.yaml:4:81: warning: .*\[style-line-length\]"

  # --fix wraps and sorts without changing the data, and is idempotent.
  craft-tidy --fix > out.txt 2> err.txt
  MATCH "applied fixes to .*imagecraft.yaml" < err.txt
  test ! -s out.txt
  cat > expected.yaml <<'EOF'
  name: my-image
  base: ubuntu@24.04
  version: '1.0'
  summary: A summary that is far too long for a single line of eighty characters
    here
  description: An image for testing craft-tidy.
  platforms:
    amd64:
  parts:
    rootfs:
      plugin: nil
      stage-packages: [linux-generic, systemd]
  EOF
  diff -u expected.yaml imagecraft.yaml
  craft-tidy --fix > out.txt 2> err.txt
  test ! -s out.txt
  test ! -s err.txt
  diff -u expected.yaml imagecraft.yaml

  # Lines that cannot be wrapped are reported with the reason.
  echo "source: https://example.com/a/very/long/url/that/cannot/be/broken/anywhere.tar.gz" >> imagecraft.yaml
  craft-tidy --fix > out.txt 2> err.txt
  MATCH "imagecraft.yaml:13:81: warning: .*\(cannot be fixed: it has no space at which it can be broken safely, .*\) \[style-line-length\]" < out.txt
  craft-tidy | NOMATCH "cannot be fixed"
  cp expected.yaml imagecraft.yaml

  # Next to a Snapcraft project, both files are linted, in alphabetical
  # order of the tools.
  mkdir snap
  printf 'name: snap\nplugs: [b, a]\n' > snap/snapcraft.yaml
  cp original.yaml imagecraft.yaml
  craft-tidy > out.txt
  cat out.txt
  test "$(wc -l < out.txt)" -eq 2
  head -n1 out.txt | MATCH "^\./imagecraft.yaml:11:"
  tail -n1 out.txt | MATCH "^\./snap/snapcraft.yaml:2:"

  # Short sequences go on one line, longer ones one item per line.
  mkdir -p $WORK/collapse
  cd $WORK/collapse
  cat > imagecraft.yaml <<'EOF'
  name: collapse
  parts:
    part:
      plugin: nil
      after:
        - other
      stage-packages: [curl, git, make]
  EOF
  craft-tidy > out.txt
  cat out.txt
  test "$(wc -l < out.txt)" -eq 2
  MATCH "imagecraft.yaml:6:7: warning: sequence has 1 item\(s\), at most 2; write it on one line as \[other\] \[style-collapsed-sequences\]" < out.txt
  MATCH "imagecraft.yaml:7:21: warning: sequence has 3 items, more than 2; write one item per line \[style-collapsed-sequences\]" < out.txt
  craft-tidy -o style-collapsed-sequences.max-collapsed-items=3 | NOMATCH "\.yaml:7:"
  craft-tidy --fix > out.txt 2> err.txt
  test ! -s out.txt
  cat > expected.yaml <<'EOF'
  name: collapse
  parts:
    part:
      plugin: nil
      after: [other]
      stage-packages:
        - curl
        - git
        - make
  EOF
  diff -u expected.yaml imagecraft.yaml

  # snapcraft-components only applies to Snapcraft.
  mkdir -p "$WORK/components"
  cd "$WORK/components"
  printf 'name: x\nparts:\n  a:\n    organize:\n      x: (component/nope)\n' > imagecraft.yaml
  craft-tidy --checks='-*,snapcraft-components' > out.txt
  test ! -s out.txt
