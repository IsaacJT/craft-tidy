summary: Lint debcraft projects

# Generated by spread/generate-tool-tasks.py; edit that instead.

execute: |
  # Every project is a conforming project file for the tool, so that all
  # checks run and each section only finds what it is about.

  # A conforming project passes every check.
  mkdir -p "$WORK/clean/."
  cd "$WORK/clean"
  cat > debcraft.yaml <<'EOF'
  name: my-package
  base: ubuntu@24.04
  version: '1.0'
  license: GPL-2.0-or-later
  summary: A package for testing craft-tidy
  description: A package for testing craft-tidy.
  platforms:
    amd64:
  parts:
    my-package:
      plugin: nil
      build-packages:
        - gcc
        - make
  EOF
  craft-tidy > out.txt
  test ! -s out.txt

  # Only debcraft.yaml in the project root is read, like debcraft does.
  mkdir -p "$WORK/discovery/sub" "$WORK/discovery/build-aux"
  cd "$WORK/discovery"
  cat > sub/debcraft.yaml <<'EOF'
  name: my-package
  base: ubuntu@24.04
  version: '1.0'
  license: GPL-2.0-or-later
  summary: A package for testing craft-tidy
  description: A package for testing craft-tidy.
  platforms:
    amd64:
  parts:
    my-package:
      plugin: nil
      build-packages:
        - gcc
        - make
  EOF
  cp sub/debcraft.yaml .debcraft.yaml
  cp sub/debcraft.yaml build-aux/debcraft.yaml
  set +e
  craft-tidy 2> err.txt
  status=$?
  set -e
  test "$status" -eq 2
  MATCH "no craft project file found" < err.txt

  # Problems are reported with locations; project-file-location only applies to Snapcraft, so a debcraft.yaml in the root is fine.
  mkdir -p "$WORK/project/."
  cd "$WORK/project"
  cat > debcraft.yaml <<'EOF'
  name: my-package
  base: ubuntu@24.04
  version: '1.0'
  license: GPL-2.0-or-later
  summary: A package for testing craft-tidy
  description: A package for testing craft-tidy.
  platforms:
    amd64:
  parts:
    my-package:
      plugin: nil
      build-packages:
        - make
        - gcc
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./debcraft.yaml:13:9: warning: entries of 'build-packages' are not sorted: 'gcc' should come before 'make' [style-sorted-lists]
  EOF
  diff -u expected.txt out.txt
  # The file can also be given explicitly.
  craft-tidy "$WORK/project/debcraft.yaml" | sed "s|^$WORK/project/|./|" > out.txt
  cat > expected.txt <<'EOF'
  ./debcraft.yaml:13:9: warning: entries of 'build-packages' are not sorted: 'gcc' should come before 'make' [style-sorted-lists]
  EOF
  diff -u expected.txt out.txt

  # Long lines are found too.
  cat > debcraft.yaml <<'EOF'
  name: my-package
  base: ubuntu@24.04
  version: '1.0'
  license: GPL-2.0-or-later
  summary: A summary that is far too long for a single line of eighty characters here
  description: A package for testing craft-tidy.
  platforms:
    amd64:
  parts:
    my-package:
      plugin: nil
      build-packages:
        - make
        - gcc
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./debcraft.yaml:5:81: warning: line is 83 characters long, exceeding the limit of 80 [style-line-length]
  ./debcraft.yaml:13:9: warning: entries of 'build-packages' are not sorted: 'gcc' should come before 'make' [style-sorted-lists]
  EOF
  diff -u expected.txt out.txt

  # --fix wraps and sorts without changing the data, and is idempotent.
  craft-tidy --fix > out.txt 2> err.txt
  test ! -s out.txt
  MATCH "^craft-tidy: applied fixes to \./debcraft.yaml \(2 issue\(s\) found, 0 remaining\)$" < err.txt
  cat > expected.yaml <<'EOF'
  name: my-package
  base: ubuntu@24.04
  version: '1.0'
  license: GPL-2.0-or-later
  summary: A summary that is far too long for a single line of eighty characters
    here
  description: A package for testing craft-tidy.
  platforms:
    amd64:
  parts:
    my-package:
      plugin: nil
      build-packages:
        - gcc
        - make
  EOF
  diff -u expected.yaml debcraft.yaml
  craft-tidy --fix > out.txt 2> err.txt
  test ! -s out.txt
  test ! -s err.txt
  diff -u expected.yaml debcraft.yaml

  # Lines that cannot be wrapped are reported with the reason, with --fix.
  cat > debcraft.yaml <<'EOF'
  name: my-package
  base: ubuntu@24.04
  version: '1.0'
  license: GPL-2.0-or-later
  summary: A summary that is far too long for a single line of eighty characters
    here
  description: A package for testing craft-tidy.
  platforms:
    amd64:
  parts:
    my-package:
      plugin: nil
      build-packages:
        - gcc
        - make
  # https://example.com/a/very/long/url/that/cannot/be/broken/anywhere/at/all.tar.gz
  EOF
  craft-tidy --fix > out.txt
  cat > expected.txt <<'EOF'
  ./debcraft.yaml:16:81: warning: line is 82 characters long, exceeding the limit of 80 (cannot be fixed: it has no space at which it can be broken safely, such as in a long URL or word) [style-line-length]
  EOF
  diff -u expected.txt out.txt
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./debcraft.yaml:16:81: warning: line is 82 characters long, exceeding the limit of 80 [style-line-length]
  EOF
  diff -u expected.txt out.txt

  # Next to a Snapcraft project, both files are linted, in alphabetical
  # order of the tools.
  mkdir -p "$WORK/project/snap"
  cat > debcraft.yaml <<'EOF'
  name: my-package
  base: ubuntu@24.04
  version: '1.0'
  license: GPL-2.0-or-later
  summary: A package for testing craft-tidy
  description: A package for testing craft-tidy.
  platforms:
    amd64:
  parts:
    my-package:
      plugin: nil
      build-packages:
        - make
        - gcc
  EOF
  cat > snap/snapcraft.yaml <<'EOF'
  name: hello
  base: core24
  version: '1.0'
  license: GPL-3.0-only
  summary: A snap for testing craft-tidy
  description: A snap for testing craft-tidy.
  confinement: strict
  platforms:
    amd64:
  apps:
    hello:
      command: bin/hello
      plugs:
        - home
        - network
        - wayland
  parts:
    hello:
      plugin: nil
      stage-packages:
        - python3
        - ca-certificates
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./debcraft.yaml:13:9: warning: entries of 'build-packages' are not sorted: 'gcc' should come before 'make' [style-sorted-lists]
  ./snap/snapcraft.yaml:21:9: warning: entries of 'stage-packages' are not sorted: 'ca-certificates' should come before 'python3' [style-sorted-lists]
  EOF
  diff -u expected.txt out.txt

  # Short sequences go on one line, longer ones one item per line.
  mkdir -p "$WORK/collapse/."
  cd "$WORK/collapse"
  cat > debcraft.yaml <<'EOF'
  name: my-package
  base: ubuntu@24.04
  version: '1.0'
  license: GPL-2.0-or-later
  summary: A package for testing craft-tidy
  description: A package for testing craft-tidy.
  platforms:
    amd64:
  parts:
    my-package:
      plugin: nil
      after:
        - other
      build-packages: [gcc, make]
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./debcraft.yaml:13:7: warning: 'after' has a single item, so it should be on one line: after: [other] [style-collapsed-sequences]
  ./debcraft.yaml:14:21: warning: 'build-packages' has 2 items, more than max-collapsed-items (1), so it should have one item per line [style-collapsed-sequences]
  EOF
  diff -u expected.txt out.txt
  craft-tidy -o style-collapsed-sequences.max-collapsed-items=2 > out.txt
  cat > expected.txt <<'EOF'
  ./debcraft.yaml:13:7: warning: 'after' has a single item, so it should be on one line: after: [other] [style-collapsed-sequences]
  EOF
  diff -u expected.txt out.txt
  craft-tidy --fix > out.txt 2> err.txt
  test ! -s out.txt
  cat > expected.yaml <<'EOF'
  name: my-package
  base: ubuntu@24.04
  version: '1.0'
  license: GPL-2.0-or-later
  summary: A package for testing craft-tidy
  description: A package for testing craft-tidy.
  platforms:
    amd64:
  parts:
    my-package:
      plugin: nil
      after: [other]
      build-packages:
        - gcc
        - make
  EOF
  diff -u expected.yaml debcraft.yaml

  # Platforms that build on and for their own architecture need no
  # definition.
  mkdir -p "$WORK/platforms/."
  cd "$WORK/platforms"
  cat > debcraft.yaml <<'EOF'
  name: my-package
  base: ubuntu@24.04
  version: '1.0'
  license: GPL-2.0-or-later
  summary: A package for testing craft-tidy
  description: A package for testing craft-tidy.
  platforms:
    amd64:
      build-on: [amd64]
      build-for: [amd64]
    arm64:
      build-on:
        - amd64
        - arm64
      build-for: [arm64]
  parts:
    my-package:
      plugin: nil
      build-packages:
        - gcc
        - make
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./debcraft.yaml:8:3: warning: platform 'amd64' only builds on and for amd64, which is what 'amd64:' alone means; remove its build-on and build-for [style-redundant-platforms]
  EOF
  diff -u expected.txt out.txt
  craft-tidy --fix > out.txt 2> err.txt
  test ! -s out.txt
  cat > expected.yaml <<'EOF'
  name: my-package
  base: ubuntu@24.04
  version: '1.0'
  license: GPL-2.0-or-later
  summary: A package for testing craft-tidy
  description: A package for testing craft-tidy.
  platforms:
    amd64:
    arm64:
      build-on:
        - amd64
        - arm64
      build-for: [arm64]
  parts:
    my-package:
      plugin: nil
      build-packages:
        - gcc
        - make
  EOF
  diff -u expected.yaml debcraft.yaml

  # Parts should not use the whole project directory as their source.
  mkdir -p "$WORK/rootsource/."
  cd "$WORK/rootsource"
  cat > debcraft.yaml <<'EOF'
  name: my-package
  base: ubuntu@24.04
  version: '1.0'
  license: GPL-2.0-or-later
  summary: A package for testing craft-tidy
  description: A package for testing craft-tidy.
  platforms:
    amd64:
  parts:
    my-package:
      plugin: nil
      build-packages:
        - gcc
        - make
    data:
      plugin: dump
      source: .
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./debcraft.yaml:17:13: warning: part 'data' uses the whole project directory as its source ('.'), so it picks up build artifacts there, which with --destructive-mode trigger rebuilds; use the directory with the code instead, such as 'src' [project-root-source]
  EOF
  diff -u expected.txt out.txt
  craft-tidy --fix > out.txt
  cat > expected.txt <<'EOF'
  ./debcraft.yaml:17:13: warning: part 'data' uses the whole project directory as its source ('.'), so it picks up build artifacts there, which with --destructive-mode trigger rebuilds; use the directory with the code instead, such as 'src' (cannot be fixed: craft-tidy cannot know which directory holds the code) [project-root-source]
  EOF
  diff -u expected.txt out.txt

  # Projects must declare their license.
  mkdir -p "$WORK/license/."
  cd "$WORK/license"
  cat > debcraft.yaml <<'EOF'
  name: my-package
  base: ubuntu@24.04
  version: '1.0'
  summary: A package for testing craft-tidy
  description: A package for testing craft-tidy.
  platforms:
    amd64:
  parts:
    my-package:
      plugin: nil
      build-packages:
        - gcc
        - make
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./debcraft.yaml:1:1: warning: the project does not declare its license; add a top-level 'license' with an SPDX expression, such as 'license: GPL-3.0-only', or 'license: proprietary' [metadata-license]
  EOF
  diff -u expected.txt out.txt

  # snapcraft-components only applies to Snapcraft.
  mkdir -p "$WORK/components"
  cd "$WORK/components"
  cat > debcraft.yaml <<'EOF'
  name: my-package
  base: ubuntu@24.04
  version: '1.0'
  license: GPL-2.0-or-later
  summary: A package for testing craft-tidy
  description: A package for testing craft-tidy.
  platforms:
    amd64:
  parts:
    my-package:
      plugin: nil
      organize:
        lib: (component/nope)
      build-packages:
        - gcc
        - make
  EOF
  craft-tidy > out.txt
  test ! -s out.txt
