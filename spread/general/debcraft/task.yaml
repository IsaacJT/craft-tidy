summary: Lint debcraft projects

execute: |
  # The sections before the style-collapsed-sequences one use flow lists
  # to test other checks, so they run without it, through a .craft-tidy that
  # every project below $WORK finds.
  echo 'checks: -style-collapsed-sequences' > "$WORK/.craft-tidy"

  cd "$WORK"

  # Only debcraft.yaml in the project root is read, like debcraft does.
  mkdir -p deb build-aux
  cat > deb/debcraft.yaml <<'EOF'
  name: my-package
  base: ubuntu@24.04
  version: '1.0'
  summary: A package for testing craft-tidy
  description: A package for testing craft-tidy.
  platforms:
    amd64:
  parts:
    my-package:
      plugin: nil
      build-packages: [make, gcc]
  EOF
  cp deb/debcraft.yaml original.yaml
  cp deb/debcraft.yaml .debcraft.yaml
  cp deb/debcraft.yaml build-aux/debcraft.yaml
  set +e
  craft-tidy 2> err.txt
  status=$?
  set -e
  test "$status" -eq 2
  MATCH "no craft project file found" < err.txt

  # Problems are reported with locations. project-file-location only
  # applies to Snapcraft, so a debcraft.yaml in the root is fine.
  mv deb/debcraft.yaml debcraft.yaml
  craft-tidy > out.txt
  cat out.txt
  test "$(wc -l < out.txt)" -eq 1
  MATCH "^\./debcraft.yaml:11:[0-9]+: warning: .*\[style-sorted-lists\]" < out.txt
  NOMATCH "project-file-location" < out.txt

  # The file can also be given explicitly.
  craft-tidy "$WORK/debcraft.yaml" | MATCH "debcraft.yaml:11:.*\[style-sorted-lists\]"

  # Long lines are found too.
  sed -i 's/^summary: .*/summary: A summary that is far too long for a single line of eighty characters here/' debcraft.yaml
  craft-tidy | MATCH "debcraft.yaml:4:81: warning: .*\[style-line-length\]"

  # --fix wraps and sorts without changing the data, and is idempotent.
  craft-tidy --fix > out.txt 2> err.txt
  MATCH "applied fixes to .*debcraft.yaml" < err.txt
  test ! -s out.txt
  cat > expected.yaml <<'EOF'
  name: my-package
  base: ubuntu@24.04
  version: '1.0'
  summary: A summary that is far too long for a single line of eighty characters
    here
  description: A package for testing craft-tidy.
  platforms:
    amd64:
  parts:
    my-package:
      plugin: nil
      build-packages: [gcc, make]
  EOF
  diff -u expected.yaml debcraft.yaml
  craft-tidy --fix > out.txt 2> err.txt
  test ! -s out.txt
  test ! -s err.txt
  diff -u expected.yaml debcraft.yaml

  # Lines that cannot be wrapped are reported with the reason.
  echo "source: https://example.com/a/very/long/url/that/cannot/be/broken/anywhere.tar.gz" >> debcraft.yaml
  craft-tidy --fix > out.txt 2> err.txt
  MATCH "debcraft.yaml:13:81: warning: .*\(cannot be fixed: it has no space at which it can be broken safely, .*\) \[style-line-length\]" < out.txt
  craft-tidy | NOMATCH "cannot be fixed"
  cp expected.yaml debcraft.yaml

  # Next to a Snapcraft project, both files are linted, in alphabetical
  # order of the tools.
  mkdir snap
  printf 'name: snap\nplugs: [b, a]\n' > snap/snapcraft.yaml
  cp original.yaml debcraft.yaml
  craft-tidy > out.txt
  cat out.txt
  test "$(wc -l < out.txt)" -eq 2
  head -n1 out.txt | MATCH "^\./debcraft.yaml:11:"
  tail -n1 out.txt | MATCH "^\./snap/snapcraft.yaml:2:"

  rm "$WORK/.craft-tidy"

  # Short sequences go on one line, longer ones one item per line.
  mkdir -p $WORK/collapse
  cd $WORK/collapse
  cat > debcraft.yaml <<'EOF'
  name: collapse
  parts:
    part:
      plugin: nil
      after:
        - other
      stage-packages: [curl, git, make]
  EOF
  craft-tidy > out.txt
  cat out.txt
  test "$(wc -l < out.txt)" -eq 2
  MATCH "debcraft.yaml:6:7: warning: 'after' has a single item, so it should be on one line: after: \[other\] \[style-collapsed-sequences\]" < out.txt
  MATCH "debcraft.yaml:7:21: warning: 'stage-packages' has 3 items, more than max-collapsed-items \(1\), so it should have one item per line \[style-collapsed-sequences\]" < out.txt
  craft-tidy -o style-collapsed-sequences.max-collapsed-items=3 | NOMATCH "\.yaml:7:"
  craft-tidy --fix > out.txt 2> err.txt
  test ! -s out.txt
  cat > expected.yaml <<'EOF'
  name: collapse
  parts:
    part:
      plugin: nil
      after: [other]
      stage-packages:
        - curl
        - git
        - make
  EOF
  diff -u expected.yaml debcraft.yaml

  # snapcraft-components only applies to Snapcraft.
  mkdir -p "$WORK/components"
  cd "$WORK/components"
  printf 'name: x\nparts:\n  a:\n    organize:\n      x: (component/nope)\n' > debcraft.yaml
  craft-tidy --checks='-*,snapcraft-components' > out.txt
  test ! -s out.txt

  # Platforms that build on and for their own architecture need no
  # definition.
  mkdir -p "$WORK/platforms"
  cd "$WORK/platforms"
  cat > debcraft.yaml <<'EOF'
  name: platforms
  platforms:
    amd64:
      build-on: [amd64]
      build-for: [amd64]
    arm64:
      build-on: [amd64, arm64]
      build-for: [arm64]
  EOF
  craft-tidy --checks='-*,style-redundant-platforms' > out.txt
  cat out.txt
  test "$(wc -l < out.txt)" -eq 1
  MATCH "debcraft.yaml:3:3: warning: platform 'amd64' only builds on and for amd64, which is what 'amd64:' alone means; remove its build-on and build-for \[style-redundant-platforms\]" < out.txt
  craft-tidy --checks='-*,style-redundant-platforms' --fix > out.txt 2> err.txt
  test ! -s out.txt
  cat > expected.yaml <<'EOF'
  name: platforms
  platforms:
    amd64:
    arm64:
      build-on: [amd64, arm64]
      build-for: [arm64]
  EOF
  diff -u expected.yaml debcraft.yaml

  # Parts should not use the whole project directory as their source.
  mkdir -p "$WORK/rootsource"
  cd "$WORK/rootsource"
  printf 'name: x\nparts:\n  app:\n    plugin: dump\n    source: .\n  lib:\n    plugin: dump\n    source: lib\n' > debcraft.yaml
  craft-tidy --checks='-*,project-root-source' > out.txt
  cat out.txt
  test "$(wc -l < out.txt)" -eq 1
  MATCH "debcraft.yaml:5:13: warning: part 'app' uses the whole project directory as its source \\('\\.'\\), so it picks up build artifacts there" < out.txt
  craft-tidy --checks='-*,project-root-source' --fix | MATCH "cannot be fixed: craft-tidy cannot know which directory holds the code"
