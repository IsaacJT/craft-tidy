summary: Lint snapcraft projects

execute: |
  # The sections before the style-collapsed-sequences one use flow lists
  # to test other checks, so they run without it, through a .craft-tidy that
  # every project below $WORK finds.
  echo 'checks: -style-collapsed-sequences' > "$WORK/.craft-tidy"

  # Project files are looked for in Snapcraft's order, and only the first
  # one found is linted.
  mkdir -p "$WORK/order/snap" "$WORK/order/build-aux/snap"
  cd "$WORK/order"
  printf 'name: test\n' > .snapcraft.yaml
  craft-tidy | MATCH "^\./\.snapcraft\.yaml: warning: .*\[project-file-location\]"
  printf 'name: test\nplugs: [b, a]\n' > build-aux/snap/snapcraft.yaml
  craft-tidy > out.txt
  test "$(wc -l < out.txt)" -eq 1
  # build-aux/snap/ is an accepted location.
  MATCH "^\./build-aux/snap/snapcraft.yaml:2:.*\[style-sorted-lists\]" < out.txt
  printf 'name: test\n' > snap/snapcraft.yaml
  craft-tidy > out.txt
  test ! -s out.txt
  printf 'name: test\n' > snapcraft.yaml
  craft-tidy | MATCH "^\./snapcraft.yaml: warning: .*\[project-file-location\]"
  cd -

  # A clean project passes.
  mkdir -p "$WORK/clean/snap"
  cat > "$WORK/clean/snap/snapcraft.yaml" <<'EOF'
  name: clean
  base: core24
  version: '1.0'
  summary: A clean project
  description: Nothing to report.
  confinement: strict
  parts:
    clean:
      plugin: nil
      build-packages:
        - curl
        - git
        - make
      stage-packages: [libssl3t64]
  EOF
  craft-tidy "$WORK/clean" > out.txt
  test ! -s out.txt

  # Problems are reported with locations, as warnings by default.
  mkdir -p "$WORK/messy"
  cat > "$WORK/messy/snapcraft.yaml" <<'EOF'
  name: messy
  summary: This summary is far too long to fit on a single line of eighty characters
  parts:
    messy:
      plugin: nil
      stage-packages: [zlib1g, curl]
  EOF
  cd "$WORK/messy"
  craft-tidy > out.txt
  cat out.txt
  MATCH "snapcraft.yaml: warning: .*\[project-file-location\]" < out.txt
  MATCH "snapcraft.yaml:2:81: warning: .*\[style-line-length\]" < out.txt
  MATCH "snapcraft.yaml:6:.*\[style-sorted-lists\]" < out.txt

  # warnings-as-errors makes the run fail.
  set +e
  craft-tidy --warnings-as-errors='style-*' > out.txt
  status=$?
  set -e
  test "$status" -eq 1
  MATCH "error: .*\[style-line-length\]" < out.txt

  # Check selection and options.
  craft-tidy --checks='-*,style-line-length' -o style-line-length.max-length=100 > out.txt
  test ! -s out.txt

  rm "$WORK/.craft-tidy"

  # Short sequences go on one line, longer ones one item per line.
  mkdir -p $WORK/collapse/snap
  cd $WORK/collapse
  cat > snap/snapcraft.yaml <<'EOF'
  name: collapse
  parts:
    part:
      plugin: nil
      after:
        - other
      stage-packages: [curl, git, make]
  EOF
  craft-tidy > out.txt
  cat out.txt
  test "$(wc -l < out.txt)" -eq 2
  MATCH "snap/snapcraft.yaml:6:7: warning: 'after' has a single item, so it should be on one line: after: \[other\] \[style-collapsed-sequences\]" < out.txt
  MATCH "snap/snapcraft.yaml:7:21: warning: 'stage-packages' has 3 items, more than max-collapsed-items \(1\), so it should have one item per line \[style-collapsed-sequences\]" < out.txt
  craft-tidy -o style-collapsed-sequences.max-collapsed-items=3 | NOMATCH "\.yaml:7:"
  craft-tidy --fix > out.txt 2> err.txt
  test ! -s out.txt
  cat > expected.yaml <<'EOF'
  name: collapse
  parts:
    part:
      plugin: nil
      after: [other]
      stage-packages:
        - curl
        - git
        - make
  EOF
  diff -u expected.yaml snap/snapcraft.yaml

  # Components used by parts must be defined.
  mkdir -p "$WORK/components/snap"
  cd "$WORK/components"
  cat > snap/snapcraft.yaml <<'EOF'
  name: components
  components:
    translations:
      type: standard
      summary: Translations
      description: Translations
  parts:
    translations:
      plugin: dump
      source: translations
      organize:
        la: (component/translatons)
      override-prime: |
        craftctl default
        cp -r extra $CRAFT_COMPONENT_DOCS_PRIME/
  EOF
  craft-tidy --checks='-*,snapcraft-components' > out.txt
  cat out.txt
  test "$(wc -l < out.txt)" -eq 3
  MATCH "snapcraft.yaml:3:3: warning: component 'translations' is defined but no part puts files in it, so it would be empty \[snapcraft-components\]" < out.txt
  MATCH "snapcraft.yaml:12:22: warning: component 'translatons' is not defined under components; did you mean 'translations'\? \[snapcraft-components\]" < out.txt
  MATCH "snapcraft.yaml:15:20: warning: .CRAFT_COMPONENT_DOCS_PRIME refers to component 'docs', which is not defined under components \[snapcraft-components\]" < out.txt
  craft-tidy --checks='-*,snapcraft-components' -o snapcraft-components.report-unused=false | NOMATCH "would be empty"
  # Not fixable; --fix leaves the file alone.
  cp snap/snapcraft.yaml before.yaml
  craft-tidy --checks='-*,snapcraft-components' --fix > /dev/null
  diff -u before.yaml snap/snapcraft.yaml
  sed -i 's/translatons/translations/; s/\$CRAFT_COMPONENT_DOCS_PRIME/$CRAFT_COMPONENT_TRANSLATIONS_PRIME/' snap/snapcraft.yaml
  craft-tidy --checks='-*,snapcraft-components' > out.txt
  test ! -s out.txt

  # Platforms that build on and for their own architecture need no
  # definition.
  mkdir -p "$WORK/platforms/snap"
  cd "$WORK/platforms"
  cat > snap/snapcraft.yaml <<'EOF'
  name: platforms
  platforms:
    amd64:
      build-on: [amd64]
      build-for: [amd64]
    arm64:
      build-on: [amd64, arm64]
      build-for: [arm64]
  EOF
  craft-tidy --checks='-*,style-redundant-platforms' > out.txt
  cat out.txt
  test "$(wc -l < out.txt)" -eq 1
  MATCH "snap/snapcraft.yaml:3:3: warning: platform 'amd64' only builds on and for amd64, which is what 'amd64:' alone means; remove its build-on and build-for \[style-redundant-platforms\]" < out.txt
  craft-tidy --checks='-*,style-redundant-platforms' --fix > out.txt 2> err.txt
  test ! -s out.txt
  cat > expected.yaml <<'EOF'
  name: platforms
  platforms:
    amd64:
    arm64:
      build-on: [amd64, arm64]
      build-for: [arm64]
  EOF
  diff -u expected.yaml snap/snapcraft.yaml

  # Parts should not use the whole project directory as their source.
  mkdir -p "$WORK/rootsource/snap"
  cd "$WORK/rootsource"
  printf 'name: x\nparts:\n  app:\n    plugin: dump\n    source: .\n  lib:\n    plugin: dump\n    source: lib\n' > snap/snapcraft.yaml
  craft-tidy --checks='-*,project-root-source' > out.txt
  cat out.txt
  test "$(wc -l < out.txt)" -eq 1
  MATCH "snap/snapcraft.yaml:5:13: warning: part 'app' uses the whole project directory as its source \\('\\.'\\), so it picks up build artifacts there" < out.txt
  craft-tidy --checks='-*,project-root-source' --fix | MATCH "cannot be fixed: craft-tidy cannot know which directory holds the code"
