summary: Lint snapcraft projects

# Generated by spread/generate-tool-tasks.py; edit that instead.

execute: |
  # Every project is a conforming project file for the tool, so that all
  # checks run and each section only finds what it is about.

  # A conforming project passes every check.
  mkdir -p "$WORK/clean/snap"
  cd "$WORK/clean"
  cat > snap/snapcraft.yaml <<'EOF'
  name: hello
  base: core24
  version: '1.0'
  license: GPL-3.0-only
  summary: A snap for testing craft-tidy
  description: A snap for testing craft-tidy.
  confinement: strict
  platforms:
    amd64:
  apps:
    hello:
      command: bin/hello
      plugs:
        - home
        - network
        - wayland
  parts:
    hello:
      plugin: nil
      stage-packages:
        - ca-certificates
        - python3
  EOF
  craft-tidy > out.txt
  test ! -s out.txt

  # Problems are reported with locations.
  mkdir -p "$WORK/project/snap"
  cd "$WORK/project"
  cat > snap/snapcraft.yaml <<'EOF'
  name: hello
  base: core24
  version: '1.0'
  license: GPL-3.0-only
  summary: A snap for testing craft-tidy
  description: A snap for testing craft-tidy.
  confinement: strict
  platforms:
    amd64:
  apps:
    hello:
      command: bin/hello
      plugs:
        - home
        - network
        - wayland
  parts:
    hello:
      plugin: nil
      stage-packages:
        - python3
        - ca-certificates
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./snap/snapcraft.yaml:21:9: warning: entries of 'stage-packages' are not sorted: 'ca-certificates' should come before 'python3' [style-sorted-lists]
  EOF
  diff -u expected.txt out.txt
  # The file can also be given explicitly.
  craft-tidy "$WORK/project/snap/snapcraft.yaml" | sed "s|^$WORK/project/|./|" > out.txt
  cat > expected.txt <<'EOF'
  ./snap/snapcraft.yaml:21:9: warning: entries of 'stage-packages' are not sorted: 'ca-certificates' should come before 'python3' [style-sorted-lists]
  EOF
  diff -u expected.txt out.txt

  # Long lines are found too.
  cat > snap/snapcraft.yaml <<'EOF'
  name: hello
  base: core24
  version: '1.0'
  license: GPL-3.0-only
  summary: A summary that is far too long for a single line of eighty characters here
  description: A snap for testing craft-tidy.
  confinement: strict
  platforms:
    amd64:
  apps:
    hello:
      command: bin/hello
      plugs:
        - home
        - network
        - wayland
  parts:
    hello:
      plugin: nil
      stage-packages:
        - python3
        - ca-certificates
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./snap/snapcraft.yaml:5:81: warning: line is 83 characters long, exceeding the limit of 80 [style-line-length]
  ./snap/snapcraft.yaml:21:9: warning: entries of 'stage-packages' are not sorted: 'ca-certificates' should come before 'python3' [style-sorted-lists]
  EOF
  diff -u expected.txt out.txt

  # --fix wraps and sorts without changing the data, and is idempotent.
  craft-tidy --fix > out.txt 2> err.txt
  test ! -s out.txt
  MATCH "^craft-tidy: applied fixes to \./snap/snapcraft.yaml \(2 issue\(s\) found, 0 remaining\)$" < err.txt
  cat > expected.yaml <<'EOF'
  name: hello
  base: core24
  version: '1.0'
  license: GPL-3.0-only
  summary: A summary that is far too long for a single line of eighty characters
    here
  description: A snap for testing craft-tidy.
  confinement: strict
  platforms:
    amd64:
  apps:
    hello:
      command: bin/hello
      plugs:
        - home
        - network
        - wayland
  parts:
    hello:
      plugin: nil
      stage-packages:
        - ca-certificates
        - python3
  EOF
  diff -u expected.yaml snap/snapcraft.yaml
  craft-tidy --fix > out.txt 2> err.txt
  test ! -s out.txt
  test ! -s err.txt
  diff -u expected.yaml snap/snapcraft.yaml

  # Lines that cannot be wrapped are reported with the reason, with --fix.
  cat > snap/snapcraft.yaml <<'EOF'
  name: hello
  base: core24
  version: '1.0'
  license: GPL-3.0-only
  summary: A summary that is far too long for a single line of eighty characters
    here
  description: A snap for testing craft-tidy.
  confinement: strict
  platforms:
    amd64:
  apps:
    hello:
      command: bin/hello
      plugs:
        - home
        - network
        - wayland
  parts:
    hello:
      plugin: nil
      stage-packages:
        - ca-certificates
        - python3
  # https://example.com/a/very/long/url/that/cannot/be/broken/anywhere/at/all.tar.gz
  EOF
  craft-tidy --fix > out.txt
  cat > expected.txt <<'EOF'
  ./snap/snapcraft.yaml:24:81: warning: line is 82 characters long, exceeding the limit of 80 (cannot be fixed: it has no space at which it can be broken safely, such as in a long URL or word) [style-line-length]
  EOF
  diff -u expected.txt out.txt
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./snap/snapcraft.yaml:24:81: warning: line is 82 characters long, exceeding the limit of 80 [style-line-length]
  EOF
  diff -u expected.txt out.txt

  # Short sequences go on one line, longer ones one item per line.
  mkdir -p "$WORK/collapse/snap"
  cd "$WORK/collapse"
  cat > snap/snapcraft.yaml <<'EOF'
  name: hello
  base: core24
  version: '1.0'
  license: GPL-3.0-only
  summary: A snap for testing craft-tidy
  description: A snap for testing craft-tidy.
  confinement: strict
  platforms:
    amd64:
  apps:
    hello:
      command: bin/hello
      plugs:
        - home
        - network
        - wayland
  parts:
    hello:
      plugin: nil
      after:
        - other
      stage-packages: [ca-certificates, python3]
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./snap/snapcraft.yaml:21:7: warning: 'after' has a single item, so it should be on one line: after: [other] [style-collapsed-sequences]
  ./snap/snapcraft.yaml:22:21: warning: 'stage-packages' has 2 items, more than max-collapsed-items (1), so it should have one item per line [style-collapsed-sequences]
  EOF
  diff -u expected.txt out.txt
  craft-tidy -o style-collapsed-sequences.max-collapsed-items=2 > out.txt
  cat > expected.txt <<'EOF'
  ./snap/snapcraft.yaml:21:7: warning: 'after' has a single item, so it should be on one line: after: [other] [style-collapsed-sequences]
  EOF
  diff -u expected.txt out.txt
  craft-tidy --fix > out.txt 2> err.txt
  test ! -s out.txt
  cat > expected.yaml <<'EOF'
  name: hello
  base: core24
  version: '1.0'
  license: GPL-3.0-only
  summary: A snap for testing craft-tidy
  description: A snap for testing craft-tidy.
  confinement: strict
  platforms:
    amd64:
  apps:
    hello:
      command: bin/hello
      plugs:
        - home
        - network
        - wayland
  parts:
    hello:
      plugin: nil
      after: [other]
      stage-packages:
        - ca-certificates
        - python3
  EOF
  diff -u expected.yaml snap/snapcraft.yaml

  # Platforms that build on and for their own architecture need no
  # definition.
  mkdir -p "$WORK/platforms/snap"
  cd "$WORK/platforms"
  cat > snap/snapcraft.yaml <<'EOF'
  name: hello
  base: core24
  version: '1.0'
  license: GPL-3.0-only
  summary: A snap for testing craft-tidy
  description: A snap for testing craft-tidy.
  confinement: strict
  platforms:
    amd64:
      build-on: [amd64]
      build-for: [amd64]
    arm64:
      build-on:
        - amd64
        - arm64
      build-for: [arm64]
  apps:
    hello:
      command: bin/hello
      plugs:
        - home
        - network
        - wayland
  parts:
    hello:
      plugin: nil
      stage-packages:
        - ca-certificates
        - python3
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./snap/snapcraft.yaml:9:3: warning: platform 'amd64' only builds on and for amd64, which is what 'amd64:' alone means; remove its build-on and build-for [style-redundant-platforms]
  EOF
  diff -u expected.txt out.txt
  craft-tidy --fix > out.txt 2> err.txt
  test ! -s out.txt
  cat > expected.yaml <<'EOF'
  name: hello
  base: core24
  version: '1.0'
  license: GPL-3.0-only
  summary: A snap for testing craft-tidy
  description: A snap for testing craft-tidy.
  confinement: strict
  platforms:
    amd64:
    arm64:
      build-on:
        - amd64
        - arm64
      build-for: [arm64]
  apps:
    hello:
      command: bin/hello
      plugs:
        - home
        - network
        - wayland
  parts:
    hello:
      plugin: nil
      stage-packages:
        - ca-certificates
        - python3
  EOF
  diff -u expected.yaml snap/snapcraft.yaml

  # Parts should not use the whole project directory as their source.
  mkdir -p "$WORK/rootsource/snap"
  cd "$WORK/rootsource"
  cat > snap/snapcraft.yaml <<'EOF'
  name: hello
  base: core24
  version: '1.0'
  license: GPL-3.0-only
  summary: A snap for testing craft-tidy
  description: A snap for testing craft-tidy.
  confinement: strict
  platforms:
    amd64:
  apps:
    hello:
      command: bin/hello
      plugs:
        - home
        - network
        - wayland
  parts:
    hello:
      plugin: nil
      stage-packages:
        - ca-certificates
        - python3
    data:
      plugin: dump
      source: .
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./snap/snapcraft.yaml:25:13: warning: part 'data' uses the whole project directory as its source ('.'), so it picks up build artifacts there, which with --destructive-mode trigger rebuilds; use the directory with the code instead, such as 'src' [project-root-source]
  EOF
  diff -u expected.txt out.txt
  craft-tidy --fix > out.txt
  cat > expected.txt <<'EOF'
  ./snap/snapcraft.yaml:25:13: warning: part 'data' uses the whole project directory as its source ('.'), so it picks up build artifacts there, which with --destructive-mode trigger rebuilds; use the directory with the code instead, such as 'src' (cannot be fixed: craft-tidy cannot know which directory holds the code) [project-root-source]
  EOF
  diff -u expected.txt out.txt

  # Projects must declare their license.
  mkdir -p "$WORK/license/snap"
  cd "$WORK/license"
  cat > snap/snapcraft.yaml <<'EOF'
  name: hello
  base: core24
  version: '1.0'
  summary: A snap for testing craft-tidy
  description: A snap for testing craft-tidy.
  confinement: strict
  platforms:
    amd64:
  apps:
    hello:
      command: bin/hello
      plugs:
        - home
        - network
        - wayland
  parts:
    hello:
      plugin: nil
      stage-packages:
        - ca-certificates
        - python3
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./snap/snapcraft.yaml:1:1: warning: the project does not declare its license; add a top-level 'license' with an SPDX expression, such as 'license: GPL-3.0-only', or 'license: proprietary' [metadata-license]
  EOF
  diff -u expected.txt out.txt

  # Project files are looked for in Snapcraft's order, and only the first
  # one found is linted; project-file-location reports those outside snap/.
  mkdir -p "$WORK/order/snap" "$WORK/order/build-aux/snap"
  cd "$WORK/order"
  cat > .snapcraft.yaml <<'EOF'
  name: hello
  base: core24
  version: '1.0'
  license: GPL-3.0-only
  summary: A snap for testing craft-tidy
  description: A snap for testing craft-tidy.
  confinement: strict
  platforms:
    amd64:
  apps:
    hello:
      command: bin/hello
      plugs:
        - home
        - network
        - wayland
  parts:
    hello:
      plugin: nil
      stage-packages:
        - ca-certificates
        - python3
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./.snapcraft.yaml: warning: .snapcraft.yaml is in the project root; move it to snap/snapcraft.yaml [project-file-location]
  EOF
  diff -u expected.txt out.txt
  # build-aux/snap/ is an accepted location.
  cat > build-aux/snap/snapcraft.yaml <<'EOF'
  name: hello
  base: core24
  version: '1.0'
  license: GPL-3.0-only
  summary: A snap for testing craft-tidy
  description: A snap for testing craft-tidy.
  confinement: strict
  platforms:
    amd64:
  apps:
    hello:
      command: bin/hello
      plugs:
        - home
        - network
        - wayland
  parts:
    hello:
      plugin: nil
      stage-packages:
        - python3
        - ca-certificates
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./build-aux/snap/snapcraft.yaml:21:9: warning: entries of 'stage-packages' are not sorted: 'ca-certificates' should come before 'python3' [style-sorted-lists]
  EOF
  diff -u expected.txt out.txt
  cat > snap/snapcraft.yaml <<'EOF'
  name: hello
  base: core24
  version: '1.0'
  license: GPL-3.0-only
  summary: A snap for testing craft-tidy
  description: A snap for testing craft-tidy.
  confinement: strict
  platforms:
    amd64:
  apps:
    hello:
      command: bin/hello
      plugs:
        - home
        - network
        - wayland
  parts:
    hello:
      plugin: nil
      stage-packages:
        - ca-certificates
        - python3
  EOF
  craft-tidy > out.txt
  test ! -s out.txt
  cat > snapcraft.yaml <<'EOF'
  name: hello
  base: core24
  version: '1.0'
  license: GPL-3.0-only
  summary: A summary that is far too long for a single line of eighty characters here
  description: A snap for testing craft-tidy.
  confinement: strict
  platforms:
    amd64:
  apps:
    hello:
      command: bin/hello
      plugs:
        - home
        - network
        - wayland
  parts:
    hello:
      plugin: nil
      stage-packages:
        - ca-certificates
        - python3
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./snapcraft.yaml: warning: snapcraft.yaml is in the project root; move it to snap/snapcraft.yaml [project-file-location]
  ./snapcraft.yaml:5:81: warning: line is 83 characters long, exceeding the limit of 80 [style-line-length]
  EOF
  diff -u expected.txt out.txt

  # warnings-as-errors makes the run fail.
  set +e
  craft-tidy --warnings-as-errors='style-*' > out.txt
  status=$?
  set -e
  test "$status" -eq 1
  cat > expected.txt <<'EOF'
  ./snapcraft.yaml: warning: snapcraft.yaml is in the project root; move it to snap/snapcraft.yaml [project-file-location]
  ./snapcraft.yaml:5:81: error: line is 83 characters long, exceeding the limit of 80 [style-line-length]
  EOF
  diff -u expected.txt out.txt

  # Check selection and options.
  craft-tidy --checks='-*,style-line-length' -o style-line-length.max-length=100 > out.txt
  test ! -s out.txt

  # Components used by parts must be defined.
  mkdir -p "$WORK/components/snap"
  cd "$WORK/components"
  cat > snap/snapcraft.yaml <<'EOF'
  name: hello
  base: core24
  version: '1.0'
  license: GPL-3.0-only
  summary: A snap for testing craft-tidy
  description: A snap for testing craft-tidy.
  confinement: strict
  components:
    translations:
      type: standard
      summary: Translations
      description: Translations
  platforms:
    amd64:
  apps:
    hello:
      command: bin/hello
      plugs:
        - home
        - network
        - wayland
  parts:
    hello:
      plugin: dump
      source: translations
      organize:
        la: (component/translatons)
      override-prime: |
        craftctl default
        cp -r extra $CRAFT_COMPONENT_DOCS_PRIME/
      stage-packages:
        - ca-certificates
        - python3
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./snap/snapcraft.yaml:9:3: warning: component 'translations' is defined but no part puts files in it, so it would be empty [snapcraft-components]
  ./snap/snapcraft.yaml:27:22: warning: component 'translatons' is not defined under components; did you mean 'translations'? [snapcraft-components]
  ./snap/snapcraft.yaml:30:20: warning: $CRAFT_COMPONENT_DOCS_PRIME refers to component 'docs', which is not defined under components [snapcraft-components]
  EOF
  diff -u expected.txt out.txt
  craft-tidy -o snapcraft-components.report-unused=false > out.txt
  cat > expected.txt <<'EOF'
  ./snap/snapcraft.yaml:27:22: warning: component 'translatons' is not defined under components; did you mean 'translations'? [snapcraft-components]
  ./snap/snapcraft.yaml:30:20: warning: $CRAFT_COMPONENT_DOCS_PRIME refers to component 'docs', which is not defined under components [snapcraft-components]
  EOF
  diff -u expected.txt out.txt
  # Not fixable; --fix leaves the file alone.
  cp snap/snapcraft.yaml before.yaml
  craft-tidy --fix > /dev/null
  diff -u before.yaml snap/snapcraft.yaml
  sed -i 's/translatons/translations/; s/\$CRAFT_COMPONENT_DOCS_PRIME/$CRAFT_COMPONENT_TRANSLATIONS_PRIME/' snap/snapcraft.yaml
  craft-tidy > out.txt
  test ! -s out.txt
