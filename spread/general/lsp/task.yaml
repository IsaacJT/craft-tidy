summary: Run the language server

execute: |
  mkdir -p "$WORK/project/snap"
  cd "$WORK/project"
  printf 'name: test\nlicense: MIT\nplugs:\n  - b\n  - a\n' > snap/snapcraft.yaml

  # A minimal LSP client: initialise the server, open the project file,
  # print the diagnostics published for it, then shut the server down.
  cat > client.py <<'EOF'
  import json, subprocess, sys

  def send(server, message):
      data = json.dumps(message).encode()
      server.stdin.write(b"Content-Length: %d\r\n\r\n" % len(data) + data)
      server.stdin.flush()

  def receive(server):
      length = None
      while True:
          line = server.stdout.readline()
          if not line:
              sys.exit("the server closed its output")
          if line in (b"\r\n", b"\n"):
              break
          key, value = line.decode().split(":", 1)
          if key.lower() == "content-length":
              length = int(value)
      return json.loads(server.stdout.read(length))

  def until(server, accept):
      while True:
          message = receive(server)
          if accept(message):
              return message

  path = sys.argv[1]
  server = subprocess.Popen(["craft-tidy", "lsp"], stdin=subprocess.PIPE, stdout=subprocess.PIPE)
  send(server, {"jsonrpc": "2.0", "id": 1, "method": "initialize",
                "params": {"processId": None, "rootUri": None, "capabilities": {}}})
  until(server, lambda m: m.get("id") == 1)
  send(server, {"jsonrpc": "2.0", "method": "initialized", "params": {}})
  send(server, {"jsonrpc": "2.0", "method": "textDocument/didOpen", "params": {
      "textDocument": {"uri": "file://" + path, "languageId": "yaml", "version": 1,
                       "text": open(path).read()}}})
  published = until(server, lambda m: m.get("method") == "textDocument/publishDiagnostics")
  for diagnostic in published["params"]["diagnostics"]:
      start = diagnostic["range"]["start"]
      print(start["line"], start["character"], diagnostic["code"], diagnostic["message"])
      send(server, {"jsonrpc": "2.0", "id": 3, "method": "textDocument/codeAction", "params": {
          "textDocument": {"uri": "file://" + path}, "range": diagnostic["range"],
          "context": {"diagnostics": [diagnostic]}}})
      for action in until(server, lambda m: m.get("id") == 3)["result"]:
          edit = action["edit"]["changes"]["file://" + path][0]
          print("action:", action["kind"], action["title"], "->", json.dumps(edit["newText"]))
      send(server, {"jsonrpc": "2.0", "id": 4, "method": "textDocument/hover", "params": {
          "textDocument": {"uri": "file://" + path}, "position": start}})
      hover = until(server, lambda m: m.get("id") == 4)["result"]
      print("hover:", hover["contents"]["value"].splitlines()[1])
  send(server, {"jsonrpc": "2.0", "id": 2, "method": "shutdown"})
  until(server, lambda m: m.get("id") == 2)
  send(server, {"jsonrpc": "2.0", "method": "exit"})
  sys.exit(server.wait(timeout=10))
  EOF

  python3 client.py "$WORK/project/snap/snapcraft.yaml" > out.txt
  # The finding (with its 0-based position), its code actions with the
  # text they insert, and the hover text of its check.
  cat > expected.txt <<'EOF'
  3 4 style-sorted-lists entries of 'plugs' are not sorted: 'a' should come before 'b'
  action: quickfix Fix: entries of 'plugs' are not sorted: 'a' should come before 'b' -> "a\n  - b"
  action: quickfix Suppress style-sorted-lists on this line with NOLINTNEXTLINE -> "# NOLINTNEXTLINE(style-sorted-lists)\n  "
  action: source.fixAll Fix all craft-tidy problems -> "a\n  - b"
  hover: style-sorted-lists: Entries of unordered lists must be sorted alphabetically
  EOF
  diff -u expected.txt out.txt

  # Without an editor, the server fails.
  set +e
  craft-tidy lsp < /dev/null 2> err.txt
  status=$?
  set -e
  test "$status" -eq 2
  MATCH "craft-tidy: error: language server:" < err.txt
