summary: Lint charmcraft projects

# Generated by spread/generate-tool-tasks.py; edit that instead.

execute: |
  # Every project is a conforming project file for the tool, so that all
  # checks run and each section only finds what it is about.

  # A conforming project passes every check.
  mkdir -p "$WORK/clean/."
  cd "$WORK/clean"
  cat > charmcraft.yaml <<'EOF'
  name: my-charm
  type: charm
  title: My charm
  summary: A charm for testing craft-tidy
  description: A charm for testing craft-tidy.
  base: ubuntu@24.04
  platforms:
    amd64:
  parts:
    charm:
      plugin: charm
      source: .
      build-packages:
        - cargo
        - libffi-dev
  EOF
  craft-tidy > out.txt
  test ! -s out.txt

  # Only charmcraft.yaml in the project root is read, like charmcraft does.
  mkdir -p "$WORK/discovery/sub" "$WORK/discovery/build-aux"
  cd "$WORK/discovery"
  cat > sub/charmcraft.yaml <<'EOF'
  name: my-charm
  type: charm
  title: My charm
  summary: A charm for testing craft-tidy
  description: A charm for testing craft-tidy.
  base: ubuntu@24.04
  platforms:
    amd64:
  parts:
    charm:
      plugin: charm
      source: .
      build-packages:
        - cargo
        - libffi-dev
  EOF
  cp sub/charmcraft.yaml .charmcraft.yaml
  cp sub/charmcraft.yaml build-aux/charmcraft.yaml
  set +e
  craft-tidy 2> err.txt
  status=$?
  set -e
  test "$status" -eq 2
  MATCH "no craft project file found" < err.txt

  # Problems are reported with locations; project-file-location only applies to Snapcraft, so a charmcraft.yaml in the root is fine.
  mkdir -p "$WORK/project/."
  cd "$WORK/project"
  cat > charmcraft.yaml <<'EOF'
  name: my-charm
  type: charm
  title: My charm
  summary: A charm for testing craft-tidy
  description: A charm for testing craft-tidy.
  base: ubuntu@24.04
  platforms:
    amd64:
  parts:
    charm:
      plugin: charm
      source: .
      build-packages:
        - libffi-dev
        - cargo
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./charmcraft.yaml:14:9: warning: entries of 'build-packages' are not sorted: 'cargo' should come before 'libffi-dev' [style-sorted-lists]
  EOF
  diff -u expected.txt out.txt
  # The file can also be given explicitly.
  craft-tidy "$WORK/project/charmcraft.yaml" | sed "s|^$WORK/project/|./|" > out.txt
  cat > expected.txt <<'EOF'
  ./charmcraft.yaml:14:9: warning: entries of 'build-packages' are not sorted: 'cargo' should come before 'libffi-dev' [style-sorted-lists]
  EOF
  diff -u expected.txt out.txt

  # Long lines are found too.
  cat > charmcraft.yaml <<'EOF'
  name: my-charm
  type: charm
  title: My charm
  summary: A summary that is far too long for a single line of eighty characters here
  description: A charm for testing craft-tidy.
  base: ubuntu@24.04
  platforms:
    amd64:
  parts:
    charm:
      plugin: charm
      source: .
      build-packages:
        - libffi-dev
        - cargo
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./charmcraft.yaml:4:81: warning: line is 83 characters long, exceeding the limit of 80 [style-line-length]
  ./charmcraft.yaml:14:9: warning: entries of 'build-packages' are not sorted: 'cargo' should come before 'libffi-dev' [style-sorted-lists]
  EOF
  diff -u expected.txt out.txt

  # --fix wraps and sorts without changing the data, and is idempotent.
  craft-tidy --fix > out.txt 2> err.txt
  test ! -s out.txt
  MATCH "^craft-tidy: applied fixes to \./charmcraft.yaml \(2 issue\(s\) found, 0 remaining\)$" < err.txt
  cat > expected.yaml <<'EOF'
  name: my-charm
  type: charm
  title: My charm
  summary: A summary that is far too long for a single line of eighty characters
    here
  description: A charm for testing craft-tidy.
  base: ubuntu@24.04
  platforms:
    amd64:
  parts:
    charm:
      plugin: charm
      source: .
      build-packages:
        - cargo
        - libffi-dev
  EOF
  diff -u expected.yaml charmcraft.yaml
  craft-tidy --fix > out.txt 2> err.txt
  test ! -s out.txt
  test ! -s err.txt
  diff -u expected.yaml charmcraft.yaml

  # Lines that cannot be wrapped are reported with the reason, with --fix.
  cat > charmcraft.yaml <<'EOF'
  name: my-charm
  type: charm
  title: My charm
  summary: A summary that is far too long for a single line of eighty characters
    here
  description: A charm for testing craft-tidy.
  base: ubuntu@24.04
  platforms:
    amd64:
  parts:
    charm:
      plugin: charm
      source: .
      build-packages:
        - cargo
        - libffi-dev
  # https://example.com/a/very/long/url/that/cannot/be/broken/anywhere/at/all.tar.gz
  EOF
  craft-tidy --fix > out.txt
  cat > expected.txt <<'EOF'
  ./charmcraft.yaml:17:81: warning: line is 82 characters long, exceeding the limit of 80 (cannot be fixed: it has no space at which it can be broken safely, such as in a long URL or word) [style-line-length]
  EOF
  diff -u expected.txt out.txt
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./charmcraft.yaml:17:81: warning: line is 82 characters long, exceeding the limit of 80 [style-line-length]
  EOF
  diff -u expected.txt out.txt

  # Next to a Snapcraft project, both files are linted, in alphabetical
  # order of the tools.
  mkdir -p "$WORK/project/snap"
  cat > charmcraft.yaml <<'EOF'
  name: my-charm
  type: charm
  title: My charm
  summary: A charm for testing craft-tidy
  description: A charm for testing craft-tidy.
  base: ubuntu@24.04
  platforms:
    amd64:
  parts:
    charm:
      plugin: charm
      source: .
      build-packages:
        - libffi-dev
        - cargo
  EOF
  cat > snap/snapcraft.yaml <<'EOF'
  name: hello
  base: core24
  version: '1.0'
  license: GPL-3.0-only
  summary: A snap for testing craft-tidy
  description: A snap for testing craft-tidy.
  confinement: strict
  platforms:
    amd64:
  apps:
    hello:
      command: bin/hello
      plugs:
        - home
        - network
        - wayland
  parts:
    hello:
      plugin: nil
      stage-packages:
        - python3
        - ca-certificates
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./charmcraft.yaml:14:9: warning: entries of 'build-packages' are not sorted: 'cargo' should come before 'libffi-dev' [style-sorted-lists]
  ./snap/snapcraft.yaml:21:9: warning: entries of 'stage-packages' are not sorted: 'ca-certificates' should come before 'python3' [style-sorted-lists]
  EOF
  diff -u expected.txt out.txt

  # Short sequences go on one line, longer ones one item per line.
  mkdir -p "$WORK/collapse/."
  cd "$WORK/collapse"
  cat > charmcraft.yaml <<'EOF'
  name: my-charm
  type: charm
  title: My charm
  summary: A charm for testing craft-tidy
  description: A charm for testing craft-tidy.
  base: ubuntu@24.04
  platforms:
    amd64:
  parts:
    charm:
      plugin: charm
      after:
        - other
      source: .
      build-packages: [cargo, libffi-dev]
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./charmcraft.yaml:13:7: warning: 'after' has a single item, so it should be on one line: after: [other] [style-collapsed-sequences]
  ./charmcraft.yaml:15:21: warning: 'build-packages' has 2 items, more than max-collapsed-items (1), so it should have one item per line [style-collapsed-sequences]
  EOF
  diff -u expected.txt out.txt
  craft-tidy -o style-collapsed-sequences.max-collapsed-items=2 > out.txt
  cat > expected.txt <<'EOF'
  ./charmcraft.yaml:13:7: warning: 'after' has a single item, so it should be on one line: after: [other] [style-collapsed-sequences]
  EOF
  diff -u expected.txt out.txt
  craft-tidy --fix > out.txt 2> err.txt
  test ! -s out.txt
  cat > expected.yaml <<'EOF'
  name: my-charm
  type: charm
  title: My charm
  summary: A charm for testing craft-tidy
  description: A charm for testing craft-tidy.
  base: ubuntu@24.04
  platforms:
    amd64:
  parts:
    charm:
      plugin: charm
      after: [other]
      source: .
      build-packages:
        - cargo
        - libffi-dev
  EOF
  diff -u expected.yaml charmcraft.yaml

  # Platforms that build on and for their own architecture need no
  # definition.
  mkdir -p "$WORK/platforms/."
  cd "$WORK/platforms"
  cat > charmcraft.yaml <<'EOF'
  name: my-charm
  type: charm
  title: My charm
  summary: A charm for testing craft-tidy
  description: A charm for testing craft-tidy.
  base: ubuntu@24.04
  platforms:
    amd64:
      build-on: [amd64]
      build-for: [amd64]
    arm64:
      build-on:
        - amd64
        - arm64
      build-for: [arm64]
  parts:
    charm:
      plugin: charm
      source: .
      build-packages:
        - cargo
        - libffi-dev
  EOF
  craft-tidy > out.txt
  cat > expected.txt <<'EOF'
  ./charmcraft.yaml:8:3: warning: platform 'amd64' only builds on and for amd64, which is what 'amd64:' alone means; remove its build-on and build-for [style-redundant-platforms]
  EOF
  diff -u expected.txt out.txt
  craft-tidy --fix > out.txt 2> err.txt
  test ! -s out.txt
  cat > expected.yaml <<'EOF'
  name: my-charm
  type: charm
  title: My charm
  summary: A charm for testing craft-tidy
  description: A charm for testing craft-tidy.
  base: ubuntu@24.04
  platforms:
    amd64:
    arm64:
      build-on:
        - amd64
        - arm64
      build-for: [arm64]
  parts:
    charm:
      plugin: charm
      source: .
      build-packages:
        - cargo
        - libffi-dev
  EOF
  diff -u expected.yaml charmcraft.yaml

  # Parts should not use the whole project directory as their source.
  mkdir -p "$WORK/rootsource/."
  cd "$WORK/rootsource"
  # Except for Charmcraft, whose charm plugin builds from there (as the
  # conforming project does).
  cat > charmcraft.yaml <<'EOF'
  name: my-charm
  type: charm
  title: My charm
  summary: A charm for testing craft-tidy
  description: A charm for testing craft-tidy.
  base: ubuntu@24.04
  platforms:
    amd64:
  parts:
    charm:
      plugin: charm
      source: .
      build-packages:
        - cargo
        - libffi-dev
  EOF
  craft-tidy > out.txt
  test ! -s out.txt

  # Projects must declare their license.
  mkdir -p "$WORK/license/."
  cd "$WORK/license"
  # Except for Charmcraft, which does not accept a license key (the
  # conforming project has none).
  cat > charmcraft.yaml <<'EOF'
  name: my-charm
  type: charm
  title: My charm
  summary: A charm for testing craft-tidy
  description: A charm for testing craft-tidy.
  base: ubuntu@24.04
  platforms:
    amd64:
  parts:
    charm:
      plugin: charm
      source: .
      build-packages:
        - cargo
        - libffi-dev
  EOF
  craft-tidy > out.txt
  test ! -s out.txt

  # snapcraft-components only applies to Snapcraft.
  mkdir -p "$WORK/components"
  cd "$WORK/components"
  cat > charmcraft.yaml <<'EOF'
  name: my-charm
  type: charm
  title: My charm
  summary: A charm for testing craft-tidy
  description: A charm for testing craft-tidy.
  base: ubuntu@24.04
  platforms:
    amd64:
  parts:
    charm:
      plugin: charm
      organize:
        lib: (component/nope)
      source: .
      build-packages:
        - cargo
        - libffi-dev
  EOF
  craft-tidy > out.txt
  test ! -s out.txt
