summary: Lint charmcraft projects

execute: |
  cd "$WORK"

  # Only charmcraft.yaml in the project root is read, like charmcraft does.
  mkdir -p charm build-aux
  cat > charm/charmcraft.yaml <<'EOF'
  name: my-charm
  type: charm
  title: My charm
  summary: A charm for testing craft-tidy
  description: A charm for testing craft-tidy.
  base: ubuntu@24.04
  platforms:
    amd64:
  parts:
    charm:
      plugin: charm
      source: .
      build-packages: [libffi-dev, cargo]
  EOF
  cp charm/charmcraft.yaml original.yaml
  cp charm/charmcraft.yaml .charmcraft.yaml
  cp charm/charmcraft.yaml build-aux/charmcraft.yaml
  set +e
  craft-tidy 2> err.txt
  status=$?
  set -e
  test "$status" -eq 2
  MATCH "no craft project file found" < err.txt

  # Problems are reported with locations. project-file-location only
  # applies to Snapcraft, so a charmcraft.yaml in the root is fine.
  mv charm/charmcraft.yaml charmcraft.yaml
  craft-tidy > out.txt
  cat out.txt
  test "$(wc -l < out.txt)" -eq 1
  MATCH "^\./charmcraft.yaml:13:[0-9]+: warning: .*\[style-sorted-lists\]" < out.txt
  NOMATCH "project-file-location" < out.txt

  # The file can also be given explicitly.
  craft-tidy "$WORK/charmcraft.yaml" | MATCH "charmcraft.yaml:13:.*\[style-sorted-lists\]"

  # Long lines are found too.
  sed -i 's/^summary: .*/summary: A summary that is far too long for a single line of eighty characters here/' charmcraft.yaml
  craft-tidy | MATCH "charmcraft.yaml:4:81: warning: .*\[style-line-length\]"

  # --fix wraps and sorts without changing the data, and is idempotent.
  craft-tidy --fix > out.txt 2> err.txt
  MATCH "applied fixes to .*charmcraft.yaml" < err.txt
  test ! -s out.txt
  cat > expected.yaml <<'EOF'
  name: my-charm
  type: charm
  title: My charm
  summary: A summary that is far too long for a single line of eighty characters
    here
  description: A charm for testing craft-tidy.
  base: ubuntu@24.04
  platforms:
    amd64:
  parts:
    charm:
      plugin: charm
      source: .
      build-packages: [cargo, libffi-dev]
  EOF
  diff -u expected.yaml charmcraft.yaml
  craft-tidy --fix > out.txt 2> err.txt
  test ! -s out.txt
  test ! -s err.txt
  diff -u expected.yaml charmcraft.yaml

  # Lines that cannot be wrapped are reported with the reason.
  echo "source: https://example.com/a/very/long/url/that/cannot/be/broken/anywhere.tar.gz" >> charmcraft.yaml
  craft-tidy --fix > out.txt 2> err.txt
  MATCH "charmcraft.yaml:15:81: warning: .*\(cannot be fixed: it has no space at which it can be broken safely, .*\) \[style-line-length\]" < out.txt
  craft-tidy | NOMATCH "cannot be fixed"
  cp expected.yaml charmcraft.yaml

  # Next to a Snapcraft project, both files are linted, in alphabetical
  # order of the tools.
  mkdir snap
  printf 'name: snap\nplugs: [b, a]\n' > snap/snapcraft.yaml
  cp original.yaml charmcraft.yaml
  craft-tidy > out.txt
  cat out.txt
  test "$(wc -l < out.txt)" -eq 2
  head -n1 out.txt | MATCH "^\./charmcraft.yaml:13:"
  tail -n1 out.txt | MATCH "^\./snap/snapcraft.yaml:2:"
