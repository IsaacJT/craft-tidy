summary: Suppress findings with NOLINT comments

execute: |
  mkdir -p "$WORK/project/snap"
  cd "$WORK/project"
  cat > snap/snapcraft.yaml <<'EOF'
  name: nolint
  # NOLINTNEXTLINE(style-line-length): the summary is quoted from upstream
  summary: This summary is far too long to fit on a single line of eighty characters
  description: This description is far too long to fit on one line of eighty characters
  plugs: [network, home] # NOLINT
  # NOLINTBEGIN(style-sorted-lists, style-collapsed-sequences)
  slots: [b, a]
  # NOLINTEND(style-collapsed-sequences, style-sorted-lists)
  apps:
    app:
      command: bin/app
  # NOLINTEND
  EOF
  craft-tidy > out.txt || true
  cat out.txt
  test "$(wc -l < out.txt)" -eq 2
  MATCH "snapcraft.yaml:4:81: warning: line is 85 characters long, exceeding the limit of 80 \[style-line-length\]" < out.txt
  MATCH "snapcraft.yaml:12:3: warning: NOLINTEND has no matching NOLINTBEGIN before it \[craft-tidy-nolint\]" < out.txt

  # --fix leaves suppressed lines alone.
  craft-tidy --fix > out.txt 2> err.txt
  MATCH "applied fixes to .*snapcraft.yaml \(2 issue\(s\) found, 1 remaining\)" < err.txt
  cat > expected.yaml <<'EOF'
  name: nolint
  # NOLINTNEXTLINE(style-line-length): the summary is quoted from upstream
  summary: This summary is far too long to fit on a single line of eighty characters
  description: This description is far too long to fit on one line of eighty
    characters
  plugs: [network, home] # NOLINT
  # NOLINTBEGIN(style-sorted-lists, style-collapsed-sequences)
  slots: [b, a]
  # NOLINTEND(style-collapsed-sequences, style-sorted-lists)
  apps:
    app:
      command: bin/app
  # NOLINTEND
  EOF
  diff -u expected.yaml snap/snapcraft.yaml
  MATCH "snapcraft.yaml:13:3: .*\[craft-tidy-nolint\]" < out.txt

  # Mistakes in NOLINT comments can be made errors like any finding.
  set +e
  craft-tidy --warnings-as-errors='craft-tidy-nolint' > out.txt
  status=$?
  set -e
  test "$status" -eq 1
  MATCH "13:3: error: NOLINTEND has no matching NOLINTBEGIN" < out.txt
