name: craft-tidy
base: core26
version: '0.1.0'
summary: A linter for craft project files such as snapcraft.yaml
description: |
  craft-tidy checks the project files of Canonical's craft tools
  (snapcraft.yaml, charmcraft.yaml, rockcraft.yaml, imagecraft.yaml and
  debcraft.yaml) for common mistakes, deprecated constructs and deviations
  from packaging best practices, helping you catch problems before you run
  a (potentially lengthy) build.
license: GPL-3.0-only

grade: devel
confinement: strict

apps:
  craft-tidy:
    command: bin/craft-tidy
    plugs: [home]

parts:
  craft-tidy:
    plugin: rust
    source: craft-tidy
    rust-channel: stable
