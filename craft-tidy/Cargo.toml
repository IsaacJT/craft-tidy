[package]
name = "craft-tidy"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A linter for the project files of the craft tools, such as snapcraft.yaml"
authors = ["Isaac True <isaac.true@canonical.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/IsaacJT/craft-tidy"
homepage = "https://github.com/IsaacJT/craft-tidy"
readme = "../README.md"
keywords = ["snapcraft", "linter", "yaml", "charmcraft", "rockcraft"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
# Smaller and slightly faster release builds (as used by the snap).
lto = true
codegen-units = 1
strip = true
